<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <rect width="700" height="380" fill="#f8f9fa" rx="8"/>
  <rect x="0" y="0" width="700" height="380" fill="none" stroke="#dee2e6" stroke-width="1" rx="8"/>
  <text x="350" y="30" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">全过程咨询碎片化困局 四大表现</text>
  
  <!-- Problem 1: 信息孤岛 -->
  <g transform="translate(20, 50)">
    <rect width="320" height="130" rx="8" fill="#e8f0fe" stroke="#1a6bff" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#1a6bff"/>
    <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">1</text>
    <text x="55" y="28" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#1a6bff">信息孤岛</text>
    <line x1="20" y1="48" x2="310" y2="48" stroke="#1a6bff" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="68" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">五家公司、五个团队、五套数据</text>
    <text x="20" y="88" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">各阶段数据互不互通，成果需重新整理</text>
    <text x="20" y="110" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#e53935" font-weight="bold">结果：重复劳动增加30%工作量</text>
  </g>
  
  <!-- Problem 2: 经验依赖 -->
  <g transform="translate(360, 50)">
    <rect width="320" height="130" rx="8" fill="#fff3e0" stroke="#ff6b35" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#ff6b35"/>
    <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">2</text>
    <text x="55" y="28" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#ff6b35">经验依赖</text>
    <line x1="20" y1="48" x2="310" y2="48" stroke="#ff6b35" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="68" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">32%资深工程师贡献60%核心能力</text>
    <text x="20" y="88" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">人离职即经验流失</text>
    <text x="20" y="110" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#e53935" font-weight="bold">结果：3年流失15%-20%核心经验</text>
  </g>
  
  <!-- Problem 3: 协同低效 -->
  <g transform="translate(20, 195)">
    <rect width="320" height="130" rx="8" fill="#f0f4ff" stroke="#5b6abf" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#5b6abf"/>
    <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">3</text>
    <text x="55" y="28" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#5b6abf">协同低效</text>
    <line x1="20" y1="48" x2="310" y2="48" stroke="#5b6abf" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="68" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">10+利益相关方、不同系统、不同节奏</text>
    <text x="20" y="88" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">设计变更链条：3-5天到2-3周</text>
    <text x="20" y="110" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#e53935" font-weight="bold">结果：25%-30%工期延误源于协同不畅</text>
  </g>
  
  <!-- Problem 4: 标准缺失 -->
  <g transform="translate(360, 195)">
    <rect width="320" height="130" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="#e53935"/>
    <text x="30" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">4</text>
    <text x="55" y="28" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#e53935">标准缺失</text>
    <line x1="20" y1="48" x2="310" y2="48" stroke="#e53935" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="68" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">服务范围说不清、交付标准定不了</text>
    <text x="20" y="88" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#444">计费方式算不准、甲乙双方预期不一致</text>
    <text x="20" y="110" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#e53935" font-weight="bold">结果：合同谈判大量时间"对齐认知"</text>
  </g>
  
  <text x="690" y="372" text-anchor="end" font-family="sans-serif" font-size="9" fill="#aaa">数据来源：中国工程咨询协会2024年调研</text>
</svg>
