<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1360" width="750" height="1360" role="img" aria-labelledby="cc-title cc-desc">
<title id="cc-title">压缩的是历史，接力的是任务状态</title>
<desc id="cc-desc">16 秒循环的教学示意。第一步，从旧历史提取候选任务状态：筛选论文，保留训练代码与训练数据公开的硬约束、核验 P2 数据的待办和 E2 引用；大段证据原文留在外部。第二步，核对候选状态中的硬约束与 E2 引用。第三步，把核对后的任务状态与近期消息组成下一轮上下文，旧历史退出活动窗口。第四步，需要判断 P2 时，沿 E2 主动请求并取回对应证据片段。外部保存不意味着每轮自动读入，也不保证核验结果正确。</desc>
<defs>
<marker id="cc-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#CBD5D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cc-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#138A84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="cc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F28C45" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
