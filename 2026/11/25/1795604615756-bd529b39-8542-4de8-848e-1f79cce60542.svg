  <text x="1268" y="724" text-anchor="middle" font-size="15" fill="#64748B">4</text>
  <text x="1412" y="724" text-anchor="middle" font-size="15" fill="#64748B">6 篇</text>

  <text x="962" y="294" text-anchor="end" font-size="20" font-weight="600" fill="#0F172A">路径一：硬核结构破界</text><rect x="980" y="265" width="213" height="46" rx="6" fill="#1D4E89"/><text x="1086.5" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">高熵 3</text><rect x="1196" y="265" width="141" height="46" rx="6" fill="#7B61FF"/><text x="1266.5" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">钛 2</text><rect x="1340" y="265" width="69" height="46" rx="6" fill="#2A9D8F"/><text x="1374.5" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text><text x="1426" y="294" font-size="20" font-weight="700" fill="#0F172A">6 篇</text><text x="962" y="378" text-anchor="end" font-size="20" font-weight="600" fill="#0F172A">路径二：结构+磁场与外场</text><rect x="980" y="349" width="213" height="46" rx="6" fill="#1D4E89"/><text x="1086.5" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">高熵 3</text><rect x="1196" y="349" width="141" height="46" rx="6" fill="#E76F51"/><text x="1266.5" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">钢 2</text><text x="1354" y="378" font-size="20" font-weight="700" fill="#0F172A">5 篇</text><text x="962" y="462" text-anchor="end" font-size="20" font-weight="600" fill="#0F172A">路径三：绿色循环与能源</text><rect x="980" y="433" width="141" height="46" rx="6" fill="#E76F51"/><text x="1050.5" y="462" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">钢 2</text><rect x="1124" y="433" width="69" height="46" rx="6" fill="#2A9D8F"/><text x="1158.5" y="462" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text><rect x="1196" y="433" width="69" height="46" rx="6" fill="#1D4E89"/><text x="1230.5" y="462" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text><rect x="1268" y="433" width="69" height="46" rx="6" fill="#7B61FF"/><text x="1302.5" y="462" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text><text x="1354" y="462" font-size="20" font-weight="700" fill="#0F172A">5 篇</text><text x="962" y="546" text-anchor="end" font-size="20" font-weight="600" fill="#0F172A">路径四：高熵跨界催化/生物</text><rect x="980" y="517" width="357" height="46" rx="6" fill="#1D4E89"/><text x="1158.5" y="546" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">高熵 5</text><text x="1354" y="546" font-size="20" font-weight="700" fill="#0F172A">5 篇</text><text x="962" y="630" text-anchor="end" font-size="20" font-weight="600" fill="#0F172A">路径五：电池与光电里的铝</text><rect x="980" y="601" width="285" height="46" rx="6" fill="#2A9D8F"/><text x="1122.5" y="630" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">铝 4</text><text x="1282" y="630" font-size="20" font-weight="700" fill="#0F172A">4 篇</text>

